<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 400px;
        margin: 40px auto;
        padding: 0 16px;
      }
      label {
        display: block;
        margin-top: 12px;
        font-weight: 600;
      }
      input {
        width: 100%;
        padding: 8px;
        margin-top: 4px;
        box-sizing: border-box;
      }
      button {
        margin-top: 16px;
        padding: 8px 16px;
        cursor: pointer;
      }
      #error {
        color: #c0392b;
        margin-top: 8px;
        min-height: 1.2em;
      }
      #entries {
        margin-top: 24px;
        padding-left: 20px;
      }
    </style>
  </head>
  <body>
    <h1>Sign Up</h1>

    <form id="signupForm">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" autocomplete="name" />

      <label for="phone">Phone Number</label>
      <input
        type="text"
        id="phone"
        name="phone"
        placeholder="09xxxxxxxx or +2519xxxxxxxx"
        autocomplete="tel"
      />

      <div id="error"></div>

      <button type="submit">Sign Up</button>
    </form>

    <ul id="entries"></ul>

    <script src="app.js"></script>
  </body>
</html>
